name: 'av_employees'
version: '1.0.0'
profile: 'av_employees'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

# Set Snowflake's MM/DD/YY pivot to (current_year - 99) on every session.
models:
  +pre_hook: "alter session set TWO_DIGIT_CENTURY_START = {{ run_started_at.year - 99 }}"
  av_employees:
    bronze:
      +materialized: table
      +schema: bronze
    silver:
      +schema: silver
      +access: protected
      staging:
        +materialized: view
      intermediate:
        +materialized: table
    gold:
      +schema: gold
      +materialized: table
      +access: protected
      +contract: { enforced: true }

data_tests:
  +pre_hook: "alter session set TWO_DIGIT_CENTURY_START = {{ run_started_at.year - 99 }}"

snapshots:
  +pre_hook: "alter session set TWO_DIGIT_CENTURY_START = {{ run_started_at.year - 99 }}"
