name: Slides

on:
  push:
    branches: [main]
    paths:
      - presentation/slides.md
      - .github/workflows/slides.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Render Marp → HTML + PDF
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: |
          mkdir -p site
          npx --yes @marp-team/marp-cli@latest presentation/slides.md \
            -o site/index.html --html --allow-local-files
          npx --yes @marp-team/marp-cli@latest presentation/slides.md \
            -o site/slides.pdf --pdf --allow-local-files

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
