version: 2

# Intermediate tests are strict (default severity: error). Intermediate
# guarantees cleaned + joined entities. Silver contract: no derived columns
# or business defaults — those belong in gold.

models:
  - name: silver_int_employee
    description: One row per employee with title, salary, and exit info. Department excluded — current dept unknowable from source.
    tests:
      - at_least_one_row
      - dbt_utils.expression_is_true:
          arguments:
            expression: "birth_date < hire_date"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "exit_date >= hire_date or exit_date is null"
    columns:
      - name: employee_id
        tests: [not_null, unique]
      - name: title_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('silver_stg_titles')
                field: title_id
      - name: birth_date
        tests: [not_null]
      - name: hire_date
        tests: [not_null]
      - name: first_name
        config:
          meta: { pii: true }
      - name: last_name
        config:
          meta: { pii: true }
      - name: salary
        config:
          meta: { pii: true }

  - name: silver_int_employee_department
    description: Bridge table, one row per (employee, department) pair. Multiple rows per employee reflect dept history.
    tests:
      - at_least_one_row
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [employee_id, department_id]
    columns:
      - name: employee_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('silver_int_employee')
                field: employee_id
      - name: department_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('silver_stg_departments')
                field: department_id
      - name: department_name
        tests: [not_null]
